plugins {
    id 'com.android.application'
}

android {
    namespace 'com.serverwebview.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.serverwebview.app"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "2.0"
    }

    signingConfigs {
        frigate {
            storeFile file('frigate.keystore')
            storePassword 'frigate123'
            keyAlias 'frigate'
            keyPassword 'frigate123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.frigate
        }
        release {
            signingConfig signingConfigs.frigate
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Fix Kotlin stdlib version conflict
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Explicitly include to unify versions
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    // Crosswalk embedded WebView engine (bundled Chromium, no system WebView needed)
    implementation files('libs/xwalk_core_library-23.53.589.4.aar')
}
